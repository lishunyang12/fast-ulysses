name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    container: pytorch/manylinux2_28-builder:cuda13.0
    env:
      PYBIN: /opt/python/cp312-cp312/bin
      FAST_ULYSSES_CUDA_ARCH: "90;100"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: $PYBIN/pip install "setuptools>=77" wheel torch==2.13.0
      - name: Build and install wheel
        run: |
          $PYBIN/pip wheel . --no-build-isolation --no-deps -w dist/
          $PYBIN/pip install dist/*.whl
      - name: Import smoke test
        working-directory: /tmp
        run: |
          $PYBIN/python -c "import fast_ulysses as f; print(f.__version__)"
          $PYBIN/python -c "from fast_ulysses import _C; print(_C.build_info())"
