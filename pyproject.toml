[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-ulysses"
description = "Minimal equal-shape Ulysses all-to-all over direct CUDA peer copies"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "fast-ulysses Authors" }]
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/triple-mu/fast-ulysses"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["fast_ulysses"]

[tool.setuptools.package-data]
fast_ulysses = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
extend-select = ["I"]
